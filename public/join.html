<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Room — Watch/Read Together</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080f;--bg-card:#0d0d1a;--bg-el:#141428;--bg-input:#0a0a16;
  --accent:#818cf8;--accent2:#22d3ee;
  --text:#f1f5f9;--muted:#64748b;--muted2:#94a3b8;
  --border:rgba(129,140,248,0.1);--border2:rgba(129,140,248,0.2);
  --red:#f87171;--green:#34d399;
}
html,body{height:100%}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(129,140,248,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(129,140,248,0.025) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
.orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none}
.o1{width:500px;height:500px;background:rgba(129,140,248,0.07);top:-200px;left:-150px}
.o2{width:400px;height:400px;background:rgba(34,211,238,0.05);bottom:-100px;right:-100px}

.card{position:relative;z-index:1;background:var(--bg-card);border:1px solid var(--border);border-radius:24px;width:100%;max-width:420px;padding:44px 40px;box-shadow:0 40px 80px rgba(0,0,0,0.4);animation:fadeIn 0.4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:0.82rem;text-decoration:none;margin-bottom:28px;transition:color 0.2s}
.back:hover{color:var(--accent)}

.icon-wrap{width:64px;height:64px;background:rgba(129,140,248,0.1);border:1px solid var(--border2);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:2rem;margin-bottom:20px}
.card-title{font-family:'Syne',sans-serif;font-weight:800;font-size:1.5rem;letter-spacing:-0.025em;margin-bottom:6px}
.room-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(129,140,248,0.08);border:1px solid var(--border2);border-radius:100px;padding:5px 14px;font-size:0.82rem;color:var(--accent);margin-bottom:24px}
.card-sub{color:var(--muted2);font-size:0.875rem;margin-bottom:28px;line-height:1.6}

.meta-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.meta-chip{background:var(--bg-el);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:0.78rem;color:var(--muted2);display:flex;align-items:center;gap:5px}

.field{margin-bottom:16px}
label{display:block;font-size:0.78rem;color:var(--muted2);font-weight:500;margin-bottom:5px;letter-spacing:0.03em;text-transform:uppercase}
input[type=password]{width:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.9rem;outline:none;transition:border-color 0.2s}
input:focus{border-color:var(--accent)}
input::placeholder{color:var(--muted)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:0.95rem;font-weight:600;cursor:pointer;transition:all 0.2s;border:none;outline:none;margin-bottom:10px}
.btn-primary{background:linear-gradient(135deg,var(--accent),#6366f1);color:#fff}
.btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 24px rgba(129,140,248,0.3)}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed}
.btn-secondary{background:var(--bg-el);color:var(--muted2);border:1px solid var(--border)}
.btn-secondary:hover{color:var(--text);border-color:var(--border2)}

.alert{padding:11px 14px;border-radius:10px;font-size:0.84rem;margin-bottom:14px;display:none;line-height:1.5}
.alert.error{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.25);color:var(--red)}
.alert.show{display:block}

.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.6s linear infinite;margin-right:5px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

.loading-state{text-align:center;padding:20px 0;color:var(--muted)}
.loading-ring{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px}

@media(max-width:480px){.card{padding:32px 24px}}
</style>
</head>
<body>
<div class="orb o1"></div>
<div class="orb o2"></div>

<div class="card" id="card">
  <a class="back" href="/mainpage">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Back to Dashboard
  </a>

  <!-- Loading state -->
  <div id="loading-state" class="loading-state">
    <div class="loading-ring"></div>
    <div>Looking up room...</div>
  </div>

  <!-- Room info (after load) -->
  <div id="room-info" style="display:none">
    <div class="icon-wrap">🚪</div>
    <div class="card-title" id="room-title">Room Name</div>
    <div class="room-badge" id="room-badge">
      <svg width="10" height="10" fill="var(--accent)" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>
      <span id="badge-text">Open Room</span>
    </div>
    <div class="meta-row" id="meta-row"></div>
    <div class="alert" id="alert"></div>
    <div id="pass-field" style="display:none">
      <p class="card-sub">🔒 This room is password protected. Enter the password to continue.</p>
      <div class="field">
        <label>Room Password</label>
        <input type="password" id="pass-input" placeholder="••••••••" autocomplete="off">
      </div>
    </div>
    <button class="btn btn-primary" id="join-btn" onclick="joinNow()">
      Enter Room →
    </button>
    <a class="btn btn-secondary" href="/mainpage">Cancel</a>
  </div>

  <!-- Error state -->
  <div id="error-state" style="display:none">
    <div class="icon-wrap" style="background:rgba(248,113,113,0.1);border-color:rgba(248,113,113,0.2)">⚠️</div>
    <div class="card-title" style="margin-bottom:12px">Room Unavailable</div>
    <div class="card-sub" id="error-msg">This room could not be found.</div>
    <a class="btn btn-primary" href="/mainpage">Back to Dashboard</a>
  </div>
</div>

<script>
const token = location.pathname.replace(/^\//, '').split('/')[0];
let roomData = null;

async function loadRoom() {
  try {
    const r = await fetch(`/api/rooms/${token}`);
    const d = await r.json();

    document.getElementById('loading-state').style.display = 'none';

    if (!r.ok) {
      document.getElementById('error-state').style.display = '';
      document.getElementById('error-msg').textContent = d.error || 'Room not found';
      return;
    }

    roomData = d;
    document.getElementById('room-info').style.display = '';
    document.getElementById('room-title').textContent = d.name;

    if (d.hasPassword) {
      document.getElementById('badge-text').textContent = '🔒 Password Protected';
      document.getElementById('pass-field').style.display = '';
    }

    // Meta chips
    const chips = [
      `👥 Max ${d.maxUsers} people`,
      d.expiresAt ? `⏰ Expires ${new Date(d.expiresAt).toLocaleString()}` : '♾️ No expiry',
      `👑 By ${d.creator?.displayName || d.creator?.username || 'Host'}`
    ];
    document.getElementById('meta-row').innerHTML = chips.map(c =>
      `<div class="meta-chip">${c}</div>`
    ).join('');

  } catch(e) {
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('error-state').style.display   = '';
    document.getElementById('error-msg').textContent = 'Network error. Please check your connection.';
  }
}

async function joinNow() {
  const btn = document.getElementById('join-btn');

  if (roomData?.hasPassword) {
    const pass = document.getElementById('pass-input').value;
    if (!pass) return showAlert('Password is required');

    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>Verifying...';

    const r = await fetch(`/api/rooms/${token}/verify`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pass })
    });
    const d = await r.json();

    if (!r.ok) {
      btn.disabled = false;
      btn.textContent = 'Enter Room →';
      return showAlert(d.error);
    }
  }

  const slug = (roomData?.name || 'room').toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'') || 'room';
  window.location.href = `/${token}/${slug}`;
}

function showAlert(msg) {
  const el = document.getElementById('alert');
  el.textContent = msg;
  el.className = 'alert error show';
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') joinNow(); });

loadRoom();
</script>
</body>
</html>
