<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Watch/Read Together</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080f;--bg-card:#0d0d1a;--bg-el:#141428;
  --accent:#818cf8;--accent2:#22d3ee;--accent3:#f472b6;
  --text:#f1f5f9;--muted:#64748b;--muted2:#94a3b8;
  --border:rgba(129,140,248,0.1);--border2:rgba(129,140,248,0.2);
  --red:#f87171;--green:#34d399;
}
html,body{height:100%}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(129,140,248,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(129,140,248,0.025) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}

.orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none}
.o1{width:600px;height:600px;background:rgba(129,140,248,0.07);top:-200px;left:-200px}
.o2{width:400px;height:400px;background:rgba(34,211,238,0.05);bottom:-100px;right:-100px}

/* CARD */
.card{position:relative;z-index:1;background:var(--bg-card);border:1px solid var(--border);border-radius:24px;width:100%;max-width:460px;padding:48px 44px;box-shadow:0 40px 80px rgba(0,0,0,0.4)}

.logo-wrap{text-align:center;margin-bottom:36px}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.5rem;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none;letter-spacing:-0.02em;display:inline-block}
.logo span{opacity:0.5}
.logo-sub{color:var(--muted);font-size:0.85rem;margin-top:6px}

/* TABS */
.tabs{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:28px}
.tab{flex:1;text-align:center;padding:9px;border-radius:9px;cursor:pointer;font-size:0.875rem;font-weight:500;color:var(--muted);transition:all 0.2s ease}
.tab.active{background:var(--accent);color:#fff}

/* GOOGLE BUTTON */
.btn-google{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:12px;background:var(--bg-el);border:1px solid var(--border2);border-radius:12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.9rem;font-weight:500;cursor:pointer;transition:all 0.2s ease;text-decoration:none;margin-bottom:8px}
.btn-google:hover{background:rgba(129,140,248,0.08);border-color:var(--border2)}
.google-icon{width:20px;height:20px;flex-shrink:0}

/* OR DIVIDER */
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:0.8rem;margin:20px 0;text-transform:uppercase;letter-spacing:0.08em}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--border)}

/* FORM */
.field{margin-bottom:16px}
label{display:block;font-size:0.8rem;color:var(--muted2);font-weight:500;margin-bottom:6px;letter-spacing:0.02em}
input[type=text],input[type=password],input[type=email]{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.9rem;outline:none;transition:border-color 0.2s ease}
input:focus{border-color:var(--accent)}
input::placeholder{color:var(--muted)}
.pass-wrap{position:relative}
.toggle-pass{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;display:flex;align-items:center}
.toggle-pass:hover{color:var(--muted2)}

.btn-submit{width:100%;padding:13px;background:linear-gradient(135deg,var(--accent),#6366f1);color:#fff;border:none;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:0.95rem;font-weight:600;cursor:pointer;transition:all 0.2s ease;margin-top:6px}
.btn-submit:hover{transform:translateY(-1px);box-shadow:0 8px 30px rgba(129,140,248,0.3)}
.btn-submit:disabled{opacity:0.6;cursor:not-allowed;transform:none}

/* ALERT */
.alert{padding:11px 14px;border-radius:10px;font-size:0.85rem;margin-bottom:16px;display:none}
.alert.error{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.25);color:var(--red)}
.alert.success{background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.25);color:var(--green)}
.alert.show{display:block}

/* FOOTER NOTE */
.auth-note{text-align:center;font-size:0.8rem;color:var(--muted);margin-top:20px}
.auth-note a{color:var(--accent);text-decoration:none}
.auth-note a:hover{text-decoration:underline}

/* Spinner */
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.6s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* GOOGLE DISABLED STATE */
.google-disabled{opacity:0.4;pointer-events:none;cursor:default}
.google-note{font-size:0.75rem;color:var(--muted);text-align:center;margin-bottom:16px}

@media(max-width:500px){.card{padding:32px 24px}}
</style>
</head>
<body>
<div class="orb o1"></div>
<div class="orb o2"></div>

<div class="card">
  <div class="logo-wrap">
    <a class="logo" href="/">Watch<span>/</span>Read Together</a>
    <div class="logo-sub" id="subtitle">Sign in to continue</div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <div class="tab active" id="tab-login" onclick="switchTab('login')">Sign In</div>
    <div class="tab" id="tab-register" onclick="switchTab('register')">Create Account</div>
  </div>

  <!-- ALERT -->
  <div class="alert" id="alert"></div>

  <!-- GOOGLE BUTTON -->
  <div id="google-section">
    <a class="btn-google" href="/auth/google" id="google-btn">
      <svg class="google-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </a>
    <p class="google-note" id="google-note" style="display:none">⚠️ Google login not configured on this server</p>
  </div>

  <div class="or">or</div>

  <!-- LOGIN FORM -->
  <div id="form-login">
    <div class="field">
      <label>Username</label>
      <input type="text" id="l-username" placeholder="your_username" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <div class="pass-wrap">
        <input type="password" id="l-password" placeholder="••••••••" autocomplete="current-password">
        <button class="toggle-pass" onclick="togglePass('l-password',this)" type="button">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <button class="btn-submit" id="login-btn" onclick="doLogin()">Sign In</button>
  </div>

  <!-- REGISTER FORM -->
  <div id="form-register" style="display:none">
    <div class="field">
      <label>Display Name</label>
      <input type="text" id="r-display" placeholder="Your Name" maxlength="30">
    </div>
    <div class="field">
      <label>Username <span style="color:var(--muted);font-size:0.75rem">(3–20 chars, letters/numbers/_)</span></label>
      <input type="text" id="r-username" placeholder="your_username" autocomplete="username" maxlength="20" oninput="this.value=this.value.toLowerCase().replace(/[^a-z0-9_]/g,'')">
    </div>
    <div class="field">
      <label>Password <span style="color:var(--muted);font-size:0.75rem">(min 6 characters)</span></label>
      <div class="pass-wrap">
        <input type="password" id="r-password" placeholder="••••••••" autocomplete="new-password">
        <button class="toggle-pass" onclick="togglePass('r-password',this)" type="button">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <button class="btn-submit" id="register-btn" onclick="doRegister()">Create Account</button>
  </div>

  <div class="auth-note">
    <span id="switch-note">Don't have an account? <a href="#" onclick="switchTab('register');return false">Register</a></span>
  </div>
</div>

<script>
let mode = 'login';

// Check Google availability
fetch('/api/auth/me').catch(()=>{});
fetch('/auth/google', {method:'HEAD',redirect:'manual'}).catch(()=>{
  document.getElementById('google-btn').classList.add('google-disabled');
  document.getElementById('google-note').style.display='block';
});

function switchTab(t) {
  mode = t;
  document.getElementById('tab-login').classList.toggle('active', t==='login');
  document.getElementById('tab-register').classList.toggle('active', t==='register');
  document.getElementById('form-login').style.display    = t==='login'    ? '' : 'none';
  document.getElementById('form-register').style.display = t==='register' ? '' : 'none';
  document.getElementById('subtitle').textContent = t==='login' ? 'Sign in to continue' : 'Create your free account';
  document.getElementById('switch-note').innerHTML = t==='login'
    ? 'Don\'t have an account? <a href="#" onclick="switchTab(\'register\');return false">Register</a>'
    : 'Already have an account? <a href="#" onclick="switchTab(\'login\');return false">Sign In</a>';
  hideAlert();
}

function showAlert(msg, type='error') {
  const el = document.getElementById('alert');
  el.textContent = msg;
  el.className = 'alert show ' + type;
}
function hideAlert() { document.getElementById('alert').className = 'alert'; }

function togglePass(id, btn) {
  const inp = document.getElementById(id);
  const isPass = inp.type === 'password';
  inp.type = isPass ? 'text' : 'password';
  btn.innerHTML = isPass
    ? '<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
    : '<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
}

function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  btn.disabled = loading;
  btn.innerHTML = loading ? '<span class="spin"></span>Please wait...' : (btnId==='login-btn' ? 'Sign In' : 'Create Account');
}

async function doLogin() {
  hideAlert();
  const username = document.getElementById('l-username').value.trim();
  const password = document.getElementById('l-password').value;
  if (!username || !password) return showAlert('Please fill in all fields');
  setLoading('login-btn', true);
  try {
    const r = await fetch('/api/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username, password })
    });
    const d = await r.json();
    if (!r.ok) { setLoading('login-btn', false); return showAlert(d.error); }
    showAlert('Welcome back! Redirecting...', 'success');
    setTimeout(() => window.location.href = '/mainpage', 800);
  } catch(e) { setLoading('login-btn', false); showAlert('Network error. Please try again.'); }
}

async function doRegister() {
  hideAlert();
  const displayName = document.getElementById('r-display').value.trim();
  const username    = document.getElementById('r-username').value.trim();
  const password    = document.getElementById('r-password').value;
  if (!username || !password) return showAlert('Username and password are required');
  if (username.length < 3) return showAlert('Username must be at least 3 characters');
  if (password.length < 6) return showAlert('Password must be at least 6 characters');
  setLoading('register-btn', true);
  try {
    const r = await fetch('/api/auth/register', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username, password, displayName: displayName || username })
    });
    const d = await r.json();
    if (!r.ok) { setLoading('register-btn', false); return showAlert(d.error); }
    showAlert('Account created! Redirecting...', 'success');
    setTimeout(() => window.location.href = '/mainpage', 800);
  } catch(e) { setLoading('register-btn', false); showAlert('Network error. Please try again.'); }
}

// Enter key
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (mode === 'login') doLogin();
  else doRegister();
});

// Check URL params for errors
const params = new URLSearchParams(location.search);
if (params.get('error')) showAlert('Google login failed. Please try username/password instead.');

// Redirect if already logged in
fetch('/api/auth/me').then(r => { if (r.ok) window.location.href = '/mainpage'; });
</script>
</body>
</html>
